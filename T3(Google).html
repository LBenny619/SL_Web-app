<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Dash - 婆婆樂活健腦機</title>
    <!-- 💡 引入輕量級 2D 物理引擎 Matter.js，負責處理水果掉落、碰撞與滾動 -->
    <script src="https://cloudflare.com"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            height: 100vh;
            background: #f4f4f9;
            overflow: hidden;
            user-select: none;
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .active-page { display: flex !important; }

        h1 { font-size: 48px; color: #333; margin-bottom: 40px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        h2 { font-size: 36px; color: #444; margin-bottom: 30px; }
        
        .img-btn {
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            border: none;
            background: none;
        }
        .img-btn:hover { transform: scale(1.05); }
        .img-btn:active { transform: scale(0.95); }

        .menu-container { display: flex; gap: 40px; }
        .game-choice-btn { width: 250px; height: 250px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); background: #fff; padding: 10px; }

        .lobby-buttons { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .mode-select-container { display: flex; gap: 30px; margin-bottom: 30px; }
        .mode-btn {
            font-size: 24px; padding: 15px 30px; border: 3px solid #ccc; border-radius: 15px;
            background: white; cursor: pointer; font-weight: bold;
        }
        .mode-btn.selected { border-color: #ff9800; background: #fff3e0; color: #e65100; }

        .hud-container {
            position: absolute; top: 20px; left: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 10;
        }
        .hud-box {
            background: rgba(255,255,255,0.95); border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 2px solid #333;
        }
        #timer-box { font-size: 24px; padding: 8px 16px; font-weight: bold; color: #333; }
        #score-box { font-size: 38px; padding: 12px 24px; font-weight: bold; color: #2e7d32; }

        #danger-countdown {
            position: absolute; top: 20px; right: 20px;
            background: #ffc107; color: #000; font-size: 32px; font-weight: bold;
            padding: 10px 20px; border-radius: 15px; border: 3px solid #000;
            display: none; animation: pulse 1s infinite;
        }

        .game-top-zone { text-align: center; margin-top: 40px; }
        #game-stage-title { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
        .arrow-container {
            display: inline-flex; gap: 20px; background: rgba(255,255,255,0.9);
            padding: 20px 40px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            transition: opacity 0.5s ease; /* 讓困難模式隱形時有漸變效果 */
        }
        
        /* 💡 困難模式下，時間到觸發隱形：只隱藏「尚未踩對」的箭頭，保留已經踩對的綠色 Tick */
        .arrow-container.hidden-arrows .arrow:not(.correct) {
            opacity: 0 !important;
        }
        

        .arrow {
            font-size: 75px; font-weight: bold; color: #b0bec5; width: 95px; height: 95px;
            display: flex; align-items: center; justify-content: center; transition: all 0.15s;
        }
        .arrow.active { color: #000; background: #ffeb3b; border-radius: 12px; transform: scale(1.1); }
        
        /* 輸入正確：變成綠色方塊底色 */
        .arrow.correct {
            background-color: #e8f5e9; /* 柔和淺綠底 */
            border: 4px solid #4caf50; /* 鮮明綠邊框 */
            border-radius: 15px;
            transform: scale(0.95);
        }

        /* 💡 困難模式專屬：即使整個容器隱形了，已經踩對的綠色打勾方塊依然強制顯示出來！ */
        .arrow-container.hidden-arrows .arrow.correct {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .arrow.wrong { color: #f44336; animation: shake 0.25s ease; }

        .game-track {
            width: 100%; height: 220px; position: relative;
            background: rgba(255,255,255,0.3); border-top: 6px dashed #555; margin-top: auto; margin-bottom: 60px;
        }
        .character {
            font-size: 90px; position: absolute; bottom: 15px; left: 5%;
            transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        .rank-tabs { display: flex; gap: 15px; margin-bottom: 20px; }
        .tab-btn { font-size: 20px; padding: 10px 20px; cursor: pointer; border: 2px solid #333; border-radius: 10px; background: #fff; }
        .tab-btn.active { background: #333; color: #fff; }
        .rank-table {
            width: 80%; max-width: 700px; background: white; border-collapse: collapse;
            border-radius: 15px; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.1); font-size: 24px;
        }
        .rank-table th, .rank-table td { padding: 15px 20px; text-align: center; }
        .rank-table th { background: #eceff1; color: #37474f; font-weight: bold; }
        .rank-table tr:nth-child(even) { background: #f8f9fa; }
        .back-home-btn { margin-top: 30px; font-size: 22px; padding: 12px 30px; cursor: pointer; border-radius: 10px; background: #333; color: white; border: none; }

        .scratch-iframe { width: 480px; height: 400px; border: 5px solid #333; border-radius: 15px; background: white; }

        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
    </style>
</head>

<body>

    <!-- ──────────────── PAGE 1: 遊戲大廳主選單 ──────────────── -->
    <div id="page-main-menu" class="page active-page">
        <h1>👵 婆婆活腦遊樂場 👴</h1>
        <div class="menu-container">
            <button class="img-btn" onclick="enterGameLobby('market')">
                <img id="btn-img-market" class="game-choice-btn" src="images/btn_market.png" alt="街市大冒險">
            </button>
            <button class="img-btn" onclick="enterGameLobby('maze')">
                <img id="btn-img-maze" class="game-choice-btn" src="images/btn_maze.png" alt="迷宮探險">
            </button>
            <button class="img-btn" onclick="enterGameLobby('fruit')">
                <img id="btn-img-fruit" class="game-choice-btn" src="images/btn_fruit.png" alt="水果組合">
            </button>
        </div>
    </div>

    <!-- ──────────────── PAGE 2: 遊戲準備頁 (模式與關卡獨立選擇頁) ──────────────── -->
    <div id="page-game-lobby" class="page">
        <h2 id="lobby-game-title">遊戲準備</h2>
        
        <div id="market-mode-selector" class="mode-select-container">
            <button id="mode-normal-btn" class="mode-btn" onclick="chooseMarketMode('normal')">普通模式 (循序漸進)</button>
            <button id="mode-hard-btn" class="mode-btn" onclick="chooseMarketMode('hard')">困難模式 (5秒極限)</button>
        </div>

        <div id="stage-selector-container" class="mode-select-container" style="display: none; margin-bottom: 30px;">
            <button id="stage-btn-0" class="mode-btn" onclick="selectStage(0)">關卡 1</button>
            <button id="stage-btn-1" class="mode-btn" onclick="selectStage(1)">關卡 2</button>
            <button id="stage-btn-2" class="mode-btn" onclick="selectStage(2)">關卡 3</button>
        </div>

        <div class="lobby-buttons" id="action-buttons-container" style="display: none;">
            <button class="back-home-btn" style="background: #2e7d32; font-size: 28px; padding: 15px 40px;" onclick="startGame()">開始遊戲</button>
            <button class="back-home-btn" style="background: #0288d1; font-size: 22px; padding: 10px 30px;" onclick="viewLeaderboardFromLobby()">查看本關排行榜</button>
        </div>

        <button class="back-home-btn" id="lobby-back-btn" onclick="switchPage('page-main-menu')">返回主選單</button>
    </div>

    <!-- ──────────────── PAGE 3: 街市大冒險 遊戲主畫面 ──────────────── -->
    <div id="page-game-market" class="page" style="background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);">
        <div class="hud-container">
            <div class="hud-box" id="timer-box">時間：<span id="display-time">00:00</span></div>
            <div class="hud-box" id="score-box">分數：<span id="display-score">0</span></div>
        </div>

        <div id="danger-countdown">⏳ 剩餘 <span id="step-timer">5</span> 秒</div>

        <div class="game-top-zone">
            <div id="game-stage-title">第 1 關 (進度: 0 / 10)</div>
            <div class="arrow-container" id="arrow-box"></div>
        </div>

        <div class="game-track">
            <div class="character" id="player-char">🏃‍♂️</div>
        </div>

        <!-- 💡 核心新增：客製化過關輸入名字小視窗（完全替代 prompt，大字體、絕不卡死） -->
        <div id="custom-win-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; flex-direction: column;">
            <div style="background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 4px solid #ff9800; max-width: 500px; width: 90%;">
                <h2 style="color: #e65100; font-size: 40px; margin-bottom: 10px;">🎉 恭喜成功通關！</h2>
                <p id="modal-game-stats" style="font-size: 24px; color: #555; margin-bottom: 25px;">分數：0 分 | 耗時：0 秒</p>
                <label style="font-size: 24px; font-weight: bold; display: block; margin-bottom: 10px; color: #333;">請輸入您的大名留念：</label>
                <input type="text" id="senior-name-input" placeholder="例如：陳大文" style="font-size: 28px; padding: 10px 15px; width: 80%; text-align: center; border: 3px solid #ccc; border-radius: 10px; margin-bottom: 25px; outline: none;">
                <br>
                <button class="back-home-btn" style="background: #2e7d32; font-size: 26px; padding: 12px 40px; margin: 0;" onclick="submitSeniorScore()">確定登錄</button>
            </div>
        </div>
    </div>

    <!-- ──────────────── PAGE 4: 遊戲進行畫面 (迷宮 Scratch / 原生水果組合) ──────────────── -->
    <div id="page-game-scratch" class="page" style="background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);">
        <!-- 左上角 HUD 計時與計分板（水果組合專用） -->
        <div class="hud-container" id="fruit-hud" style="display: none;">
            <div class="hud-box" id="fruit-timer-box" style="font-size: 24px; padding: 8px 16px; font-weight: bold;">時間：<span id="fruit-time">00:00</span></div>
            <div class="hud-box" id="fruit-score-box" style="font-size: 38px; padding: 12px 24px; font-weight: bold; color: #e65100;">分數：<span id="fruit-score">0</span></div>
        </div>

        <h2 id="scratch-title" style="margin-bottom: 15px;">遊戲中</h2>
        
        <!-- 迷宮用的 Scratch 內嵌框 -->
        <iframe id="scratch-frame" class="scratch-iframe" src="" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen></iframe>
        
        <!-- 原生【水果組合】正方形物理箱子容器 -->
        <div id="fruit-game-wrapper" style="display: none; flex-direction: column; align-items: center;">
            <p style="font-size: 20px; color: #555; margin-bottom: 10px; font-weight: bold;">⬅️ ➡️ 移動位置 ｜ ⬇️ 放下水果（滿出紅線即結算）</p>
            <div id="fruit-canvas-container" style="width: 520px; height: 520px; border: 8px solid #795548; border-top: none; border-radius: 0 0 20px 20px; background: rgba(255,255,255,0.85); box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative;"></div>
        </div>

        <button class="back-home-btn" style="margin-top: 20px; background: #d84315;" onclick="exitScratchGame()">提前結束並結算成績</button>
    </div>



    <!-- ──────────────── PAGE 5: 排行榜動態顯示頁 ──────────────── -->
    <div id="page-leaderboard" class="page">
        <h2>🏆 榮譽排行榜 🏆</h2>
        
        <div class="rank-tabs" id="market-rank-tabs">
            <button id="tab-btn-normal-1" class="tab-btn" onclick="changeRankTab('normal-1')">關卡 1</button>
            <button id="tab-btn-normal-2" class="tab-btn" onclick="changeRankTab('normal-2')">關卡 2</button>
            <button id="tab-btn-normal-3" class="tab-btn" onclick="changeRankTab('normal-3')">關卡 3</button>
            <button id="tab-btn-hard" class="tab-btn" onclick="changeRankTab('hard')">困難模式</button>
        </div>

        <table class="rank-table">
            <thead>
                <tr>
                    <th width="20%">排名</th>
                    <th width="40%">長者姓名</th>
                    <th width="20%">花費時間</th>
                    <th width="20%">最終得分</th>
                </tr>
            </thead>
            <tbody id="leaderboard-tbody">
                <!-- 資料由 JS 動態塞入 -->
            </tbody>
        </table>
        <button class="back-home-btn" style="background: #555;" onclick="returnFromLeaderboard()">返回上一頁</button>
        <!-- 💡 加在「返回上一頁」按鈕的下方，方便測試和報告時使用 -->

        ## 這個區塊是能夠刪掉旁行榜裡的內容的
        <div style="margin-top: 50px; display: flex; gap: 20px;">
            <!-- 點擊這個會直接把後台的 JSON 內容用彈窗完整顯示出來 -->
            <button style="padding: 5px 10px; font-size: 14px; background: #607d8b; color: white; border: none; border-radius: 5px; cursor: pointer;" 
                    onclick="alert('當前後台 JSON 儲存內容：\n' + localStorage.getItem('senior_game_leaderboard'))">
                🔍 檢查後台 JSON 數據
            </button>
            
            <!-- 💡 上台演示防尷尬機制：一鍵把之前的測試歷史紀錄全部洗掉，讓排行榜回歸空白！ -->
            <button style="padding: 5px 10px; font-size: 14px; background: #d32f2f; color: white; border: none; border-radius: 5px; cursor: pointer;" 
                    onclick="if(confirm('確定要清空所有排行榜紀錄嗎？（上台前專用）')){localStorage.removeItem('senior_game_leaderboard'); location.reload();}">
                🗑️ 一鍵清空排行榜
            </button>
            
        </div>

    </div>

        <script>
        // ──────────────── 1. 全域變數與資料設定 ────────────────
        let currentGame = '';       
        let marketMode = 'normal';   
        
        let score = 0;
        let totalSeconds = 0;
        let gameInterval = null;
        let stepTimerInterval = null;
        let stepSecondsLeft = 5;
        
        let currentStage = 0;       // 0=關卡1, 1=關卡2, 2=關卡3
        let currentStep = 0;        
        
        // 💡 修正關鍵：數值已完美補齊，語法不會再報錯卡死！
        let stepsNeeded = [10, 12, 15];      
        let arrowsPerStage = [3, 4, 5];     
        
        let targetArrows = [];
        let inputIndex = 0;

        const ARROWS = [
            { key: 'ArrowUp', char: '⬆️' }, { key: 'ArrowDown', char: '⬇️' },
            { key: 'ArrowLeft', char: '⬅️' }, { key: 'ArrowRight', char: '➡️' }
        ];

        // 自動檢測瀏覽器 localStorage 的 JSON 機制
        function getLeaderboardFromStorage() {
            let data = localStorage.getItem('senior_game_leaderboard');
            if (data) {
                return JSON.parse(data); 
            } else {
                return {
                    'market-normal-1': [], 'market-normal-2': [], 'market-normal-3': [],
                    'market-hard': [], 'maze': [], 'fruit': []
                };
            }
        }
        
        let leaderboardData = getLeaderboardFromStorage();
        let currentActiveTab = 'normal-1'; 

        // 全域膝蓋防沉迷保護
        let globalPlayTime = 0;
        setInterval(() => {
            globalPlayTime++;
            if (globalPlayTime === 180) {
                alert("📢 溫馨提示：已經玩了 3 分鐘囉！請坐下來休息一下，保護膝蓋！");
            }
        }, 1000);

        // ──────────────── 2. 頁面路由與導覽邏輯 ────────────────
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
        }

        function enterGameLobby(gameKey) {
            currentGame = gameKey;
            const titles = { 'market': '🛒 街市大冒險', 'maze': '🧭 迷宮大探險', 'fruit': '🍎 水果大組合' };
            document.getElementById('lobby-game-title').innerText = titles[gameKey];
            
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            
            if (gameKey === 'market') {
                document.getElementById('market-mode-selector').style.display = 'flex';
                document.getElementById('stage-selector-container').style.display = 'none';
                document.getElementById('action-buttons-container').style.display = 'none';
            } else {
                document.getElementById('market-mode-selector').style.display = 'none';
                document.getElementById('stage-selector-container').style.display = 'none';
                document.getElementById('action-buttons-container').style.display = 'flex';
            }
            switchPage('page-game-lobby');
        }

        function chooseMarketMode(mode) {
            marketMode = mode;
            document.querySelectorAll('#market-mode-selector .mode-btn').forEach(b => b.classList.remove('selected'));
            document.querySelectorAll('#stage-selector-container .mode-btn').forEach(b => b.classList.remove('selected'));
            
            if (mode === 'normal') {
                document.getElementById('mode-normal-btn').classList.add('selected');
                document.getElementById('stage-selector-container').style.display = 'flex'; 
                document.getElementById('action-buttons-container').style.display = 'none';  
            } else {
                document.getElementById('mode-hard-btn').classList.add('selected');
                document.getElementById('stage-selector-container').style.display = 'none'; 
                document.getElementById('action-buttons-container').style.display = 'flex';  
                currentActiveTab = 'hard'; 
            }
        }

        function selectStage(stageIndex) {
            currentStage = stageIndex;
            document.querySelectorAll('#stage-selector-container .mode-btn').forEach((b, idx) => {
                b.classList.toggle('selected', idx === stageIndex);
            });
            document.getElementById('action-buttons-container').style.display = 'flex'; 
            currentActiveTab = `normal-${stageIndex + 1}`; 
        }

        // ──────────────── 3. 迷宮 (Scratch) 與 純原生離線水果組合 控制 ────────────────
        const SCRATCH_URLS = {
            'maze': 'https://mit.edu'
        };

        const FRUIT_LEVELS = [
            { level: 0, emoji: '🍒', radius: 30, score: 2 },
            { level: 1, emoji: '🍓', radius: 45, score: 5 },
            { level: 2, emoji: '🍇', radius: 65, score: 10 },
            { level: 3, emoji: '🍊', radius: 85, score: 20 },
            { level: 4, emoji: '🍎', radius: 110, score: 40 },
            { level: 5, emoji: '🍈', radius: 140, score: 80 },
            { level: 6, emoji: '🍉', radius: 180, score: 160 }
        ];

        let fruits = [];             // 存放箱子裡所有水果的陣列
        let fruitAnimId = null;      // 動畫迴圈 ID
        let currentDropX = 260;
        let nextFruitLevel = 0;
        let canDropFruit = true;
        let isFruitGameOver = false;

        function startScratchGame() {
            totalSeconds = 0;
            score = 0;
            switchPage('page-game-scratch');

            if (currentGame === 'maze') {
                document.getElementById('scratch-title').innerText = '🧭 迷宮大探險';
                document.getElementById('scratch-frame').style.display = 'block';
                document.getElementById('fruit-game-wrapper').style.display = 'none';
                document.getElementById('fruit-hud').style.display = 'none';
                document.getElementById('scratch-frame').src = SCRATCH_URLS['maze'] || '';
                
                score = 100;
                clearInterval(gameInterval);
                gameInterval = setInterval(() => { totalSeconds++; }, 1000);
            } else if (currentGame === 'fruit') {
                document.getElementById('scratch-title').innerText = '🍉 巨無霸水果組合';
                document.getElementById('scratch-frame').style.display = 'none';
                document.getElementById('fruit-game-wrapper').style.display = 'flex';
                document.getElementById('fruit-hud').style.display = 'flex';
                
                document.getElementById('fruit-score').innerText = '0';
                document.getElementById('fruit-time').innerText = '00:00';

                clearInterval(gameInterval);
                gameInterval = setInterval(() => {
                    totalSeconds++;
                    let mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                    let secs = String(totalSeconds % 60).padStart(2, '0');
                    document.getElementById('fruit-time').innerText = `${mins}:${secs}`;
                }, 1000);

                initFruitPhysicsGame();
            }
        }

        function initFruitPhysicsGame() {
            const container = document.getElementById('fruit-canvas-container');
            container.innerHTML = ''; // 清空舊畫布
            
            // 建立純原生 HTML5 Canvas 畫布 (520 x 520)
            const canvas = document.createElement('canvas');
            canvas.width = 520;
            canvas.height = 520;
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');

            fruits = [];
            isFruitGameOver = false;
            canDropFruit = true;
            currentDropX = 260;
            nextFruitLevel = Math.floor(Math.random() * 3);

            if (fruitAnimId) cancelAnimationFrame(fruitAnimId);

            // 啟動 60FPS 物理與繪圖主迴圈
            function gameLoop() {
                if (isFruitGameOver) return;
                updateFruitPhysics(520, 520);
                drawFruitCanvas(ctx, 520, 520);
                fruitAnimId = requestAnimationFrame(gameLoop);
            }
            gameLoop();
        }

        // 純原生 2D 圓形重力、彈性碰撞與合成演算法
        function updateFruitPhysics(width, height) {
            const gravity = 0.55;
            const friction = 0.92;
            const bounce = 0.25;

            // 1. 套用重力與邊界阻擋
            for (let i = 0; i < fruits.length; i++) {
                let f = fruits[i];
                f.vy += gravity;
                f.x += f.vx;
                f.y += f.vy;
                f.vx *= friction;

                // 左右牆壁碰撞
                if (f.x - f.radius < 0) {
                    f.x = f.radius;
                    f.vx = -f.vx * bounce;
                } else if (f.x + f.radius > width) {
                    f.x = width - f.radius;
                    f.vx = -f.vx * bounce;
                }

                // 地板碰撞
                if (f.y + f.radius > height) {
                    f.y = height - f.radius;
                    f.vy = -f.vy * bounce;
                    if (Math.abs(f.vy) < 1) f.vy = 0;
                }
            }

            // 2. 水果之間的碰撞推擠與相同等級合成（多執行幾次讓堆疊更穩定）
            for (let iter = 0; iter < 3; iter++) {
                for (let i = 0; i < fruits.length; i++) {
                    for (let j = i + 1; j < fruits.length; j++) {
                        let a = fruits[i];
                        let b = fruits[j];
                        if (a.merged || b.merged) continue;

                        let dx = b.x - a.x;
                        let dy = b.y - a.y;
                        let dist = Math.hypot(dx, dy);
                        let minDist = a.radius + b.radius;

                        if (dist < minDist && dist > 0) {
                            // 相同等級的水果碰在一起 ➡️ 合成升級！
                            if (a.level === b.level && a.level < FRUIT_LEVELS.length - 1) {
                                a.merged = true;
                                b.merged = true;

                                let nextLvl = a.level + 1;
                                let midX = (a.x + b.x) / 2;
                                let midY = (a.y + b.y) / 2;

                                score += FRUIT_LEVELS[nextLvl].score;
                                document.getElementById('fruit-score').innerText = score;

                                spawnFruitBody(midX, midY, nextLvl);
                            } else {
                                // 不同等級 ➡️ 物理推開不重疊
                                let overlap = (minDist - dist) / 2;
                                let nx = dx / dist;
                                let ny = dy / dist;

                                a.x -= nx * overlap;
                                a.y -= ny * overlap;
                                b.x += nx * overlap;
                                b.y += ny * overlap;

                                // 稍微傳遞水平滑動速度，讓水果會自然滾動
                                a.vx -= nx * 0.4;
                                b.vx += nx * 0.4;
                            }
                        }
                    }
                }
            }

            // 過濾掉已經合成消失的舊水果
            fruits = fruits.filter(f => !f.merged);

            // 3. 檢查是否有靜止水果滿出頂部警戒紅線 (Y = 95)
            for (let i = 0; i < fruits.length; i++) {
                let f = fruits[i];
                if (f.hasSettled && (f.y - f.radius < 95) && Math.abs(f.vy) < 0.8) {
                    isFruitGameOver = true;
                    setTimeout(exitScratchGame, 400);
                    break;
                }
            }
        }

        function drawFruitCanvas(ctx, width, height) {
            ctx.clearRect(0, 0, width, height);

            // 1. 畫頂部滿箱警戒紅線 (Y = 95)
            ctx.beginPath();
            ctx.moveTo(0, 95);
            ctx.lineTo(width, 95);
            ctx.strokeStyle = 'rgba(244, 67, 54, 0.8)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 8]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 2. 畫頂部準備放下的水果預覽與垂直瞄準線
            if (canDropFruit && !isFruitGameOver) {
                const previewData = FRUIT_LEVELS[nextFruitLevel];
                
                ctx.beginPath();
                ctx.moveTo(currentDropX, 45);
                ctx.lineTo(currentDropX, height);
                ctx.strokeStyle = 'rgba(121, 85, 72, 0.35)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.font = `${previewData.radius * 1.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(previewData.emoji, currentDropX, 45);
            }

            // 3. 畫箱子裡所有掉落的水果
            for (let i = 0; i < fruits.length; i++) {
                let f = fruits[i];
                const fData = FRUIT_LEVELS[f.level];
                ctx.font = `${fData.radius * 1.85}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(fData.emoji, f.x, f.y);
            }
        }

        function spawnFruitBody(x, y, level) {
            const fData = FRUIT_LEVELS[level];
            const newFruit = {
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 1.5, // 給予極微小的隨機水平偏移，避免垂直疊成一座高塔不會滾動
                vy: 0,
                radius: fData.radius,
                level: level,
                merged: false,
                hasSettled: false
            };
            // 給予 1.2 秒掉落緩衝期，避免剛從頂部放下時就誤判滿線
            setTimeout(() => { newFruit.hasSettled = true; }, 1200);
            fruits.push(newFruit);
        }

        function dropCurrentFruit() {
            if (!canDropFruit || isFruitGameOver) return;
            canDropFruit = false;
            
            spawnFruitBody(currentDropX, 45, nextFruitLevel);
            
            setTimeout(() => {
                if (!isFruitGameOver) {
                    nextFruitLevel = Math.floor(Math.random() * 3);
                    const r = FRUIT_LEVELS[nextFruitLevel].radius;
                    currentDropX = Math.max(r + 10, Math.min(520 - r - 10, currentDropX));
                    canDropFruit = true;
                }
            }, 500);
        }

        function exitScratchGame() {
            clearInterval(gameInterval);

            if (fruitAnimId) cancelAnimationFrame(fruitAnimId);
            document.getElementById('modal-game-stats').innerText = `最終分數：${score} 分 | 總花費時間：${totalSeconds} 秒`;
            document.getElementById('senior-name-input').value = '';
            document.getElementById('custom-win-modal').style.display = 'flex';
            
            document.getElementById('page-game-scratch').appendChild(document.getElementById('custom-win-modal'));
            setTimeout(() => { document.getElementById('senior-name-input').focus(); }, 100);
        }


        // ──────────────── 4. 街市大冒險 核心邏輯 ────────────────
        function startGame() {
            if (currentGame !== 'market') {
                startScratchGame();
                return;
            }
            score = 0;
            totalSeconds = 0;
            currentStep = 0;
            
            document.getElementById('display-score').innerText = score;
            document.getElementById('display-time').innerText = "00:00";
            document.getElementById('custom-win-modal').style.display = 'none'; // 隱藏過關視窗
            
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                totalSeconds++;
                let mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
                let secs = String(totalSeconds % 60).padStart(2, '0');
                document.getElementById('display-time').innerText = `${mins}:${secs}`;
            }, 1000);

            switchPage('page-game-market');
            initMarketStage();
        }

        function initMarketStage() {
            updateHUDAndCharacter();
            generateSequence();
        }

        function updateHUDAndCharacter() {
            let maxSteps = (marketMode === 'hard') ? 10 : stepsNeeded[currentStage];
            let modeTitle = (marketMode === 'hard') ? '困難模式' : `第 ${currentStage + 1} 關`;
            document.getElementById('game-stage-title').innerText = `${modeTitle} (進度: ${currentStep} / ${maxSteps})`;
            
            let progress = currentStep / maxSteps;
            document.getElementById('player-char').style.left = `${5 + (progress * 85)}%`;
        }

        function generateSequence() {
            inputIndex = 0;
            targetArrows = [];
            const container = document.getElementById('arrow-box');
            container.innerHTML = '';
            
            container.classList.remove('hidden-arrows');

            let count = (marketMode === 'hard') ? 4 : arrowsPerStage[currentStage];

            for(let i=0; i<count; i++) {
                let rand = ARROWS[Math.floor(Math.random() * ARROWS.length)];
                targetArrows.push(rand);

                let div = document.createElement('div');
                div.className = 'arrow';
                div.innerText = rand.char;
                div.id = `m-arrow-${i}`;
                container.appendChild(div);
            }
            highlightArrows();

            if (marketMode === 'hard') {
                startStepTimer();
            } else {
                document.getElementById('danger-countdown').style.display = 'none';
            }
        }

        function highlightArrows() {
            for(let i=0; i<targetArrows.length; i++) {
                let div = document.getElementById(`m-arrow-${i}`);
                if(!div) continue;
                
                div.classList.remove('active', 'correct', 'wrong');
                
                if (i < inputIndex) {
                    // 【已經輸入正確】：套用綠色方塊樣式，並將內容換成綠色 Tick (✅)
                    div.classList.add('correct');
                    div.innerText = '✅'; 
                    
                    // 💡 備註：如果未來你們要換成自己的圖片，把上面那行 div.innerText = '✅'; 刪掉，改用下面這行即可：
                    // div.innerHTML = '<img src="images/green_tick.png" style="width: 70px; height: 70px;">';
                    
                } else if (i === inputIndex) {
                    // 【當前要輸入的】：確保顯示原本的上下左右箭頭，並亮黃燈
                    div.innerText = targetArrows[i].char;
                    div.classList.add('active');
                } else {
                    // 【尚未輸入的】：保持顯示原本的上下左右箭頭
                    div.innerText = targetArrows[i].char;
                }
            }
        }

        function startStepTimer() {
            clearInterval(stepTimerInterval);
            stepSecondsLeft = 5;
            document.getElementById('danger-countdown').style.display = 'block';
            document.getElementById('step-timer').innerText = stepSecondsLeft;

            stepTimerInterval = setInterval(() => {
                stepSecondsLeft--;
                document.getElementById('step-timer').innerText = stepSecondsLeft;
                if (stepSecondsLeft <= 0) {
                    clearInterval(stepTimerInterval);
                    handleWrongInput();
                    document.getElementById('arrow-box').classList.add('hidden-arrows');
                }
            }, 1000);
        }

        function handleWrongInput() {
            score = Math.max(0, score - 1);
            document.getElementById('display-score').innerText = score;
            
            let errDiv = document.getElementById(`m-arrow-${inputIndex}`);
            if (errDiv) {
                errDiv.classList.add('wrong');
                setTimeout(() => errDiv.classList.remove('wrong'), 250);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('page-game-market').classList.contains('active-page')) {
                if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
                
                // 如果目前過關小視窗開著，就禁止鍵盤再操控遊戲
                if(document.getElementById('custom-win-modal').style.display === 'flex') return;
                
                e.preventDefault();

                if (e.key === targetArrows[inputIndex].key) {
                    inputIndex++;
                    highlightArrows();

                    if (inputIndex === targetArrows.length) {
                        clearInterval(stepTimerInterval);
                        score += 5;
                        document.getElementById('display-score').innerText = score;
                        
                        currentStep++;
                        updateHUDAndCharacter();

                        let maxSteps = (marketMode === 'hard') ? 10 : stepsNeeded[currentStage];
                        if (currentStep >= maxSteps) {
                            clearInterval(gameInterval); 
                            setTimeout(endGameSuccess, 300); 
                        } else {
                            setTimeout(generateSequence, 150); 
                        }
                    }
                } else {
                    handleWrongInput();
                }
            }
            // 2. 水果組合按鍵監聽（左右移動、向下放下）
            if (document.getElementById('page-game-scratch').classList.contains('active-page') && currentGame === 'fruit') {
                if (document.getElementById('custom-win-modal').style.display === 'flex') return;
                if (!['ArrowLeft', 'ArrowRight', 'ArrowDown'].includes(e.key)) return;
                e.preventDefault();

                const r = FRUIT_LEVELS[nextFruitLevel].radius;
                const moveStep = 35;

                if (e.key === 'ArrowLeft') {
                    currentDropX = Math.max(r + 10, currentDropX - moveStep);
                } else if (e.key === 'ArrowRight') {
                    currentDropX = Math.min(520 - r - 10, currentDropX + moveStep);
                } else if (e.key === 'ArrowDown') {
                    dropCurrentFruit();
                }
            }
        });

        // 💡 修正關鍵流程：走到指定步數，直接彈出我們自製的 HTML 視窗，絕對不卡死！
        function endGameSuccess() {
            clearInterval(gameInterval);
            clearInterval(stepTimerInterval);
            
            // 更新小視窗內的通關數據文字
            document.getElementById('modal-game-stats').innerText = `最終分數：${score} 分 | 總花費時間：${totalSeconds} 秒`;
            // 清空上一次輸入的名字欄位
            document.getElementById('senior-name-input').value = '';
            
            // 彈出精美的自製 HTML 輸入視窗
            document.getElementById('custom-win-modal').style.display = 'flex';
            
            // 自動把滑鼠游標鎖定到名字輸入框，方便長輩直接打字
            setTimeout(() => {
                document.getElementById('senior-name-input').focus();
            }, 100);
        }

        // 💡 當長輩填完名字、按下「確定登錄」大按鈕時觸發的後台 JSON 儲存與網頁跳轉邏輯
        function submitSeniorScore() {
            let name = document.getElementById('senior-name-input').value.trim();
            if (!name) name = "無名英雄";
            
            let key = currentGame;
            if (currentGame === 'market') {
                key = (marketMode === 'hard') ? 'market-hard' : `market-normal-${currentStage + 1}`;
                currentActiveTab = (marketMode === 'hard') ? 'hard' : `normal-${currentStage + 1}`;
            }
            
            leaderboardData[key].push({ name: name, time: totalSeconds, score: score });
            localStorage.setItem('senior_game_leaderboard', JSON.stringify(leaderboardData));
            
            document.getElementById('custom-win-modal').style.display = 'none';
            showLeaderboardPage(currentGame);
        }


        // ──────────────── 5. 排行榜資料篩選與顯示 ────────────────
        function viewLeaderboardFromLobby() {
            showLeaderboardPage(currentGame);
        }

        function showLeaderboardPage(gameKey) {
            if (gameKey === 'market') {
                document.getElementById('market-rank-tabs').style.display = 'flex';
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                const activeTabBtn = document.getElementById(`tab-btn-${currentActiveTab}`);
                if(activeTabBtn) activeTabBtn.classList.add('active');
            } else {
                document.getElementById('market-rank-tabs').style.display = 'none';
            }
            renderTableData(gameKey);
            switchPage('page-leaderboard');
        }

        function changeRankTab(tabKey) {
            currentActiveTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-btn-${tabKey}`).classList.add('active');
            renderTableData('market');
        }

        function renderTableData(gameKey) {
            let dataKey = gameKey;
            if (gameKey === 'market') {
                dataKey = `market-${currentActiveTab}`;
            }

            let records = leaderboardData[dataKey] || [];
            
            
            records.sort((a, b) => {
                if (a.time === b.time) return b.score - a.score;
                return a.time - b.time;
            });

            const tbody = document.getElementById('leaderboard-tbody');
            tbody.innerHTML = '';

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:#999; padding:30px;">目前此關卡暫無長者紀錄</td></tr>`;
                return;
            }

            records.forEach((rec, idx) => {
                let mins = String(Math.floor(rec.time / 60)).padStart(2, '0');
                let secs = String(rec.time % 60).padStart(2, '0');
                let rankIcon = (idx === 0) ? '🥇' : (idx === 1) ? '🥈' : (idx === 2) ? '🥉' : (idx + 1);
                
                let row = `<tr>
                    <td>${rankIcon}</td>
                    <td><strong>${rec.name}</strong></td>
                    <td>${mins}:${secs}</td>
                    <td style="color:#2e7d32; font-weight:bold;">${rec.score} 分</td>

                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // 修正BUG：讓排行榜的返回按鈕能夠順利回到上一個選單
        function returnFromLeaderboard() {
            switchPage('page-game-lobby');
        };
    </script>
</body>
